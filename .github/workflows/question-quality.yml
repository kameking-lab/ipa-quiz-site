name: Question Quality Check

on:
  push:
    branches: [main]
    paths:
      - "data/questions/**"
  pull_request:
    branches: [main]
    paths:
      - "data/questions/**"
  workflow_dispatch:

jobs:
  validate:
    name: Validate Question Data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run question schema validation
        run: pnpm validate:questions

      - name: Run data integrity audit (gates on critical findings)
        # scripts/audit-questions.ts — fails (exit 1) on critical findings
        # (missing fields, duplicate IDs, broken choices/answer). Already-
        # gated needsReview questions are demoted to warning automatically.
        run: ./node_modules/.bin/tsx scripts/audit-questions.ts --ci

      - name: Detect explanation-answer mismatches (regex only)
        # .env.local はCI環境に存在しないため tsx 直呼び（--env-file 不使用）
        run: ./node_modules/.bin/tsx scripts/detect-explanation-mismatch.ts -- --regex-only

      - name: Audit explanations that dispute the official answer (gates on disputes)
        # scripts/audit-explanation-vs-answer.ts exits 1 if any high-confidence
        # "admits the official answer then argues against it" explanation exists
        # (phase 11 / empirical review A-9). The vitest gate enforces the same in
        # the e2e workflow; this is the data-change-scoped guard.
        run: ./node_modules/.bin/tsx scripts/audit-explanation-vs-answer.ts

      - name: Check mismatch count
        run: |
          MISMATCHES=$(node -e "
            const fs = require('fs');
            const path = 'logs/explanation-mismatches.json';
            if (!fs.existsSync(path)) { console.log('0'); process.exit(0); }
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            console.log(data.regexMismatches ?? 0);
          ")
          echo "Mismatches found: $MISMATCHES"
          if [ "$MISMATCHES" -gt "0" ]; then
            echo "::warning::解説矛盾 $MISMATCHES 件を検出。pnpm regen:verified で修正してください。"
          fi

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-quality-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm typecheck
