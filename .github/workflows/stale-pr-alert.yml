name: Stale PR Alert

# 長期滞留 PR に気づくための週次チェック。
#
# 209 ファイル規模の PR が 58 日オープンのまま本番へ出ていない、という状態が
# 実際に起きた。滞留そのものより「滞留していることに誰も気づかない」ほうが
# 問題なので、週 1 で一覧にして人の目に入れる。
#
# 通知先は 2 段構え。SLACK_WEBHOOK_URL があれば Slack へ送り、無ければ
# GitHub Issue を 1 本だけ作る（同じ Issue が既に開いていれば本文を上書きし、
# 毎週 Issue が増えないようにする）。secret 未設定でも黙って無効化されない
# ことを優先している。
#
# PR タイトルは外部入力なので ${{ }} でシェルへ展開しない。本文はファイルに
# 書き出してステップ間で受け渡す（式展開はシェル実行前のテキスト置換なので、
# タイトルにヒアドキュメントの終端子を仕込まれると脱出できてしまう）。

on:
  schedule:
    # 毎週月曜 00:00 UTC = 月曜 09:00 JST
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "滞留とみなす日数"
        required: false
        default: "7"

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  check:
    name: Report stale PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STALE_DAYS: ${{ github.event.inputs.days || '7' }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      ISSUE_TITLE: "⏳ 長期滞留 PR の一覧"

    steps:
      - name: Collect stale PRs
        id: collect
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-${STALE_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          now=$(date -u +%s)

          gh pr list --repo "${GITHUB_REPOSITORY}" --state open \
            --json number,title,createdAt,isDraft,url \
            --limit 100 > all.json

          jq --arg cutoff "$cutoff" '
            [ .[] | select(.createdAt < $cutoff) ] | sort_by(.createdAt)
          ' all.json > stale.json

          count=$(jq 'length' stale.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"

          {
            printf '%s 日以上オープンな PR が %s 件あります。\n\n' "$STALE_DAYS" "$count"
            jq -r --arg now "$now" '
              .[] | "- #\(.number) \(if .isDraft then "(Draft) " else "" end)\(.title)\n  \(.url) — オープンから \((($now | tonumber) - (.createdAt | fromdateiso8601)) / 86400 | floor) 日"
            ' stale.json
          } > stale-body.md

          echo "--- 生成した本文 ---"
          cat stale-body.md

      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## 長期滞留 PR"
            echo ""
            if [ -s stale-body.md ] && [ "${{ steps.collect.outputs.count }}" != "0" ]; then
              cat stale-body.md
            else
              echo "${STALE_DAYS} 日以上オープンな PR はありません。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack
        if: steps.collect.outputs.count != '0' && env.SLACK_WEBHOOK_URL != ''
        run: |
          set -euo pipefail
          jq -Rs '{text: ("⏳ [過去問AI] 長期滞留 PR のお知らせ\n\n" + .)}' stale-body.md > payload.json
          curl -sS -X POST -H "content-type: application/json" \
            --data @payload.json "${SLACK_WEBHOOK_URL}" > /dev/null

      # Slack が無い環境でも気づけるように Issue へ落とす。既存の同名 Issue が
      # 開いていれば本文を上書きし、毎週 Issue が積み上がらないようにする。
      - name: Open or update tracking issue
        if: steps.collect.outputs.count != '0' && env.SLACK_WEBHOOK_URL == ''
        run: |
          set -euo pipefail
          printf '\n---\n_Stale PR Alert が自動更新しています。滞留が解消されると次回の実行で閉じます。_\n' >> stale-body.md

          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --search "\"${ISSUE_TITLE}\" in:title" --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "${GITHUB_REPOSITORY}" --body-file stale-body.md
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "${ISSUE_TITLE}" --body-file stale-body.md
          fi

      - name: Close tracking issue when nothing is stale
        if: steps.collect.outputs.count == '0'
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --search "\"${ISSUE_TITLE}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "${GITHUB_REPOSITORY}" \
              --comment "滞留していた PR がすべて解消されました。"
          fi
