name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede runs only within the same PR. Every main push keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 55k+ question JSON imports exceed Node's default heap in tsc and next build.
env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ADMIN_BASIC_USER: ${{ secrets.ADMIN_BASIC_USER }}
      ADMIN_BASIC_PASS: ${{ secrets.ADMIN_BASIC_PASS }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate E2E workflow gate
        run: node --test .github/scripts/e2e-workflow.test.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Validate safety exam sources and contracted coverage
        run: node scripts/validate-safety-exams.mjs --require-consultant-five-years --require-explanations

      - name: Validate government-only explanation links
        run: node scripts/validate-government-source-links.mjs --skip-live

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Keep this image aligned with pnpm-lock.yaml; browsers and OS deps are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --init --ipc=host
    defaults:
      run:
        shell: bash

    env:
      ADMIN_BASIC_USER: ${{ secrets.ADMIN_BASIC_USER }}
      ADMIN_BASIC_PASS: ${{ secrets.ADMIN_BASIC_PASS }}
      # AUTH_SECRET / DATABASE_URL / STRIPE_* は意図的に未設定。
      # graceful degradation を E2E で検証する。

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify preinstalled Playwright browsers
        run: |
          node <<'NODE'
          const { accessSync, constants } = require('node:fs');
          const version = require('@playwright/test/package.json').version;
          if (version !== '1.60.0') {
            throw new Error(`Update the Playwright container to match installed version ${version}.`);
          }
          const { chromium } = require('@playwright/test');
          accessSync(chromium.executablePath(), constants.X_OK);
          console.log(`Playwright ${version}: preinstalled Chromium is available.`);
          NODE

      - name: Run E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Keep the existing required check name and fail closed for every dependency.
  e2e:
    name: e2e
    needs: [quality, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          const entries = Object.entries(jobs);
          for (const [name, job] of entries) {
            console.log(`${name}: ${job.result ?? 'missing'}`);
          }
          if (entries.length !== 2 || entries.some(([, job]) => job.result !== 'success')) {
            console.error('Every required job must succeed for this run.');
            process.exit(1);
          }
          NODE
