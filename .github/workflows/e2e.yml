name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede runs only within the same PR. Every main push keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ADMIN_BASIC_USER: ${{ secrets.ADMIN_BASIC_USER }}
      ADMIN_BASIC_PASS: ${{ secrets.ADMIN_BASIC_PASS }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate E2E workflow gate
        run: node --test .github/scripts/e2e-workflow.test.mjs .github/scripts/inert-change-scope.test.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Validate safety exam sources and contracted coverage
        run: node scripts/validate-safety-exams.mjs --require-consultant-five-years --require-explanations

      - name: Validate government-only explanation links
        run: node scripts/validate-government-source-links.mjs --skip-live

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ADMIN_BASIC_USER: ${{ secrets.ADMIN_BASIC_USER }}
      ADMIN_BASIC_PASS: ${{ secrets.ADMIN_BASIC_PASS }}
      # AUTH_SECRET / DATABASE_URL / STRIPE_* は意図的に未設定。
      # graceful degradation を E2E で検証する。

    steps:
      - uses: actions/checkout@v4
        with:
          # The synthetic merge contains the PR base and head as its parents.
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate browser applicability regressions
        run: node --test .github/scripts/inert-change-scope.test.mjs

      - name: Prove browser applicability for this complete PR diff
        id: scope
        env:
          SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCOPE_HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/inert-change-scope.mjs github

      - name: Install dependencies
        if: steps.scope.outputs.inert != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.scope.outputs.inert != 'true'
        run: pnpm build

      - name: Configure bounded APT downloads
        if: steps.scope.outputs.inert != 'true'
        run: |
          set -euo pipefail
          # Match the current runner-images acquire bounds, after older image overrides.
          sudo tee /etc/apt/apt.conf.d/zzzz-e2e-acquire >/dev/null <<'EOF'
          Acquire::Retries "1";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF
          # Both failed runs reached this HTTPS mirror while Azure HTTP package downloads stalled.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
          cat /etc/apt/apt-mirrors.txt

      - name: Install Playwright browsers
        if: steps.scope.outputs.inert != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        if: steps.scope.outputs.inert != 'true'
        run: pnpm e2e

      - name: Upload Playwright report
        if: always() && steps.scope.outputs.inert != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Keep the existing required check name and fail closed for every dependency.
  e2e:
    name: e2e
    needs: [quality, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          const entries = Object.entries(jobs);
          for (const [name, job] of entries) {
            console.log(`${name}: ${job.result ?? 'missing'}`);
          }
          if (entries.length !== 2 || entries.some(([, job]) => job.result !== 'success')) {
            console.error('Every required job must succeed for this run.');
            process.exit(1);
          }
          NODE
