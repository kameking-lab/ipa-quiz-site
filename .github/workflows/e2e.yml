name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ADMIN_BASIC_USER: ${{ secrets.ADMIN_BASIC_USER }}
      ADMIN_BASIC_PASS: ${{ secrets.ADMIN_BASIC_PASS }}
      # AUTH_SECRET / DATABASE_URL / STRIPE_* は意図的に未設定。
      # graceful degradation を E2E で検証する。

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Validate safety exam sources and contracted coverage
        run: node scripts/validate-safety-exams.mjs --require-consultant-five-years --require-explanations

      - name: Validate government-only explanation links
        run: node scripts/validate-government-source-links.mjs --skip-live

      - name: Build
        run: pnpm build

      - name: Configure bounded APT downloads
        run: |
          set -euo pipefail
          # Match the current runner-images acquire bounds, after older image overrides.
          sudo tee /etc/apt/apt.conf.d/zzzz-e2e-acquire >/dev/null <<'EOF'
          Acquire::Retries "1";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF
          # Both failed runs reached this HTTPS mirror while Azure HTTP package downloads stalled.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
          cat /etc/apt/apt-mirrors.txt

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
