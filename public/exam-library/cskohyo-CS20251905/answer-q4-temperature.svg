<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">向流と並流の温度分布の参考図</title>
<desc id="desc">横軸は高温流体入口から出口への位置。設問2の例では高温流体は120度から35度へ低下する。向流の低温流体は右の20度から入り左の30度へ出る。並流の低温流体は左の20度から入り右の30度へ出る。</desc>
<defs><marker id="hotArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#a63824"/></marker><marker id="coldArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#185f99"/></marker></defs>
