<text x="52" y="797" class="small" text-anchor="start">向流の青線は、左から右へ見ると低下。水は逆向きに流れるため、実際には20℃から30℃へ加熱されます。</text>
<text x="52" y="830" class="small" text-anchor="start">温度条件が異なれば向流では低温流体の出口温度が高温流体の出口温度を上回る場合もあります。</text>
