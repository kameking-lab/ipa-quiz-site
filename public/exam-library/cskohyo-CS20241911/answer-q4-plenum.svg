<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" role="img" aria-label="② プレナム方式（側断面）"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#087f8c" stroke-width="1.4"/></marker></defs><rect width="400" height="320" rx="12" fill="#fff"/><g font-family="'Noto Sans JP','Yu Gothic',sans-serif" fill="#162838"><text x="20" y="30" font-size="18" font-weight="700">② プレナム方式（側断面）</text><text x="20" y="52" font-size="12" fill="#526778">模範解答用の模式図・寸法を示す図ではありません</text><path d="M75 105L265 105L265 70 M297 70L297 105L335 105L335 245L75 245" fill="none" stroke="#34495e" stroke-width="4"/><rect x="233" y="108" width="7" height="135" fill="#b8c6d0"/><path d="M236 115V239" stroke="#fff" stroke-width="5" stroke-dasharray="5 9"/><text x="291" y="158" font-size="13">整流室</text><text x="155" y="92" font-size="13">多孔板</text><text x="15" y="181" font-size="14">開口</text><path d="M55 142L254 142" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arr)"/><path d="M55 185L254 185" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arr)"/><path d="M55 226L254 226" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arr)"/><path d="M282 222L282 62" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arr)"/><text x="20" y="286" font-size="13">多孔板の後ろに整流室を設け、上部から排気。</text><text x="20" y="307" font-size="13">板の抵抗で各高さの吸込みの偏りを抑える。</text></g></svg>