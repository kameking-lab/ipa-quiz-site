<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" role="img" aria-label="③ バッフル方式（側断面）"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#087f8c" stroke-width="1.4"/></marker></defs><rect width="400" height="320" rx="12" fill="#fff"/><g font-family="'Noto Sans JP','Yu Gothic',sans-serif" fill="#162838"><text x="20" y="30" font-size="18" font-weight="700">③ バッフル方式（側断面）</text><text x="20" y="52" font-size="12" fill="#526778">模範解答用の模式図・寸法を示す図ではありません</text><path d="M75 105L228 105L228 70 M260 70L260 105L335 105L335 245L75 245" fill="none" stroke="#34495e" stroke-width="4"/><path d="M190 152H296" stroke="#c15f28" stroke-width="7"/><text x="188" y="181" font-size="13">バッフル（邪魔板）</text><text x="15" y="202" font-size="14">開口</text><text x="265" y="83" font-size="13">上部排気口</text><path d="M55 192L150 192Q177 192 177 159Q177 126 222 125" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arr)"/><path d="M55 228L295 228Q314 220 313 174Q317 131 267 125" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arr)"/><path d="M244 132L244 62" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arr)"/><text x="20" y="286" font-size="13">テーク・オフ直下に板を置き、直吸いを防ぐ。</text><text x="20" y="307" font-size="13">気流を回り込ませ、開口風速の偏りを抑える。</text></g></svg>