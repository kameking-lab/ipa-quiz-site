<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" role="img" aria-label="④ 角形ダクトの断面"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#087f8c" stroke-width="1.4"/></marker></defs><rect width="400" height="320" rx="12" fill="#fff"/><g font-family="'Noto Sans JP','Yu Gothic',sans-serif" fill="#162838"><text x="20" y="30" font-size="18" font-weight="700">④ 角形ダクトの断面</text><text x="20" y="52" font-size="12" fill="#526778">模範解答用の模式図・寸法を示す図ではありません</text><rect x="65" y="88" width="270" height="150" fill="#eff8fb" stroke="#34495e" stroke-width="4"/><ellipse cx="200" cy="163" rx="93" ry="48" fill="#b9e4e5"/><text x="166" y="158" font-size="14">中心部</text><text x="166" y="180" font-size="14">比較的速い</text><rect x="67" y="90" width="23" height="23" fill="#ecd5bc"/><rect x="310" y="90" width="23" height="23" fill="#ecd5bc"/><rect x="67" y="213" width="23" height="23" fill="#ecd5bc"/><rect x="310" y="213" width="23" height="23" fill="#ecd5bc"/><text x="85" y="76" font-size="14">四隅付近：流れが遅い</text><text x="69" y="261" font-size="13">同じ風量・同じ単位長さの圧損で円管へ換算</text><text x="20" y="286" font-size="13">縦横比・周長によって摩擦損失が変わる。</text><text x="20" y="307" font-size="13">相当直径は、内接円の直径ではない。</text></g></svg>