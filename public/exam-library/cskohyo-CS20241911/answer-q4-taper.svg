<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" role="img" aria-label="① テーパー形状（側断面）"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#087f8c" stroke-width="1.4"/></marker></defs><rect width="400" height="320" rx="12" fill="#fff"/><g font-family="'Noto Sans JP','Yu Gothic',sans-serif" fill="#162838"><text x="20" y="30" font-size="18" font-weight="700">① テーパー形状（側断面）</text><text x="20" y="52" font-size="12" fill="#526778">模範解答用の模式図・寸法を示す図ではありません</text><path d="M75 130L218 88L218 70 M252 70L252 88L325 130L325 245L75 245" fill="none" stroke="#34495e" stroke-width="4"/><text x="270" y="87" font-size="14">上部排気口</text><text x="15" y="181" font-size="14">開口</text><text x="102" y="100" font-size="14">傾斜天井</text><path d="M53 160L151 160Q200 150 233 101L233 63" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arr)"/><path d="M53 195L165 195Q248 175 247 118" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arr)"/><path d="M53 229L205 229Q292 210 286 154" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arr)"/><text x="20" y="286" font-size="13">天井を絞り、上部にテーク・オフを設ける。</text><text x="20" y="307" font-size="13">急な流れの偏りを抑え、開口風速を均一化。</text></g></svg>