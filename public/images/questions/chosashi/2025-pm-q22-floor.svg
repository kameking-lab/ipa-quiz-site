<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="160mm" viewBox="0 0 210 160" role="img" aria-label="新築倉庫の各階平面図独自作図例">
<rect width="210" height="160" fill="white"/>
<text x="8" y="9" font-size="5" font-weight="bold">午後第22問・新築倉庫 各階平面図独自作図例</text>
<text x="8" y="17" font-size="3.5">縮尺1:250（100%印刷時1m＝4mm）。寸法は柱・壁の中心線。</text>
<text x="8" y="27" font-size="4">附属建物符号5 倉庫　1階　190.75㎡</text>
<path d="M15 32 H117 V68 H77 V58 H15 Z" fill="#e7f5e7" stroke="#17324d" stroke-width="0.6"/>
<path d="M77 58 H117 M77 58 V68" fill="none" stroke="#718096" stroke-width="0.3"/>
<text x="57" y="31" font-size="3">壁芯25.50m</text><text x="4" y="52" font-size="3">6.50m</text>
<text x="80" y="74" font-size="3">張出し10.00×2.50m</text>
<text x="45" y="48" font-size="3.5">倉庫</text><text x="88" y="65" font-size="3">階段・廊下</text>
<text x="143" y="27" font-size="3.5">附属建物符号6 守衛所</text>
<rect x="145" y="32" width="16" height="10" fill="#faefd9" stroke="#17324d" stroke-width="0.6"/>
<text x="166" y="38" font-size="3">4.00×2.50=10.00㎡</text>
<text x="8" y="88" font-size="4">附属建物符号5 倉庫　2階　165.30㎡</text>
<path d="M15 93 H117 V129 H77 V119 H15 Z" fill="#e7f0fc" stroke="#17324d" stroke-width="0.6"/>
<rect x="15" y="111" width="28" height="8" fill="white" stroke="#a92828" stroke-width="0.4" stroke-dasharray="1.5 1"/>
<rect x="77" y="119" width="9.2" height="10" fill="white" stroke="#a92828" stroke-width="0.4" stroke-dasharray="1.5 1"/>
<rect x="86.2" y="119" width="22.8" height="4" fill="white" stroke="#a92828" stroke-width="0.4" stroke-dasharray="1.5 1"/>
<text x="17" y="109" font-size="2.7">南西吹抜7.00×2.00</text>
<text x="115" y="119" font-size="2.7">南東L字吹抜</text>
<text x="115" y="124" font-size="2.7">2.30×2.50+5.70×1.00</text>
<text x="58" y="92" font-size="3">壁芯25.50m</text><text x="44" y="107" font-size="3.5">倉庫</text>
<text x="8" y="141" font-size="3">1階:25.50×6.50+10.00×2.50=190.75㎡</text>
<text x="8" y="147" font-size="3">2階:190.75−7.00×2.00−(2.30×2.50+5.70×1.00)=165.30㎡</text>
<text x="8" y="154" font-size="2.7">原問の室内間仕切・柱・腰高壁は公式問題PDF p.41と照合すること。</text>
</svg>