workflows:
  asc-review-status:
    name: App Store review status (read only)
    instance_type: mac_mini_m2
    max_build_duration: 10
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "asc-status-*"
          include: true
      cancel_previous_builds: false
    integrations:
      app_store_connect: App Store Key
    scripts:
      - name: Read review status of all apps (no writes)
        script: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -q codemagic-cli-tools==0.70.2 cryptography==48.0.1
          .venv/bin/python asc_status.py
    artifacts:
      - build/asc-status.json
