workflows:
  kakomon-ios-testflight:
    name: Kakomon AI - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      # Every push to an iOS branch builds and uploads automatically. Web-only commits do not.
      events:
        - push
      branch_patterns:
        - pattern: "feat/ios-app-*"
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - "mobile/**"
          - "codemagic.yaml"
    integrations:
      app_store_connect: App Store Key
    environment:
      groups:
        - kakomon_ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.kakomon-ai.app
      vars:
        APP_STORE_APPLE_ID: "6830358918"
      node: "22"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install shared web and isolated app dependencies
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          npx --yes pnpm@10.33.0 install --frozen-lockfile --ignore-scripts
          npx --no-install prisma generate
          cd "$CM_BUILD_DIR/mobile"
          npm ci
      - name: Typecheck, test and bundle local screens
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          # Never print the key. Only the public iOS SDK key is bundled.
          if [[ -z "${MOBILE_RC_IOS_PUBLIC_KEY:-}" || "$MOBILE_RC_IOS_PUBLIC_KEY" != appl_* ]]; then
            echo "Set MOBILE_RC_IOS_PUBLIC_KEY to the RevenueCat public iOS SDK key in kakomon_ios." >&2
            exit 1
          fi
          npm run typecheck
          npm test
          npm run build
      - name: Select next TestFlight build number
        script: |
          set -euo pipefail
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          # An empty successful result means no builds yet. API failures stop here.
          LATEST_BUILD_NUMBER=${LATEST_BUILD_NUMBER:-0}
          if [[ ! "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Expected an integer TestFlight build number." >&2
            exit 1
          fi
          echo "BUILD_NUMBER=$((10#$LATEST_BUILD_NUMBER + 1))" >> "$CM_ENV"
      # Optional MOBILE_ADS_* settings in kakomon_ios are consumed by ios:prepare.
      # Missing values produce a functioning app with ads disabled.
      - name: Generate native project, Ads SDK, privacy manifest and icon
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          npm run ios:prepare
          npm run ios:test
          plutil -lint ios/App/App/Info.plist ios/App/App/PrivacyInfo.xcprivacy
      - name: Apply App Store provisioning profiles
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          mkdir -p build/ios
          xcode-project use-profiles \
            --project ios/App/App.xcodeproj \
            --export-options-plist build/ios/export_options.plist
          ruby scripts/verify-ios.rb build/ios/export_options.plist
      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --config Release \
            --export-options-plist build/ios/export_options.plist \
            --ipa-directory build/ios/ipa
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. No TestFlight beta distribution; the owner tests on device after release.
        submit_to_testflight: false
        submit_to_app_store: false

  # Dedicated tags only; ordinary branch pushes still use TestFlight above.
  # Tag format and submission guards are enforced again by AscConfig.
  kakomon-asc-metadata:
    name: Kakomon AI - App Store listing and screenshots
    instance_type: mac_mini_m2
    max_build_duration: 90
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "asc-kakomon-*"
          include: true
      cancel_previous_builds: false
    integrations:
      app_store_connect: App Store Key
    environment:
      groups:
        - kakomon_ios
      vars:
        ASC_APP_VERSION: "1.0.0"
        SUBMIT_FOR_REVIEW: "false"
      node: "22"
      ruby: "3.4.7"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Route preparation tags without selecting or submitting an app build
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          if [[ "${CM_TAG:-}" =~ ^asc-kakomon-(catalog|iapshot|settings|iapreview)- ]]; then
            python3 scripts/asc_setup.py --validate
            echo 'ASC_SETUP_MODE=true' >> "$CM_ENV"
          else
            echo 'ASC_SETUP_MODE=false' >> "$CM_ENV"
          fi
      - name: Resolve dedicated tag into non-secret request parameters
        script: |
          set -euo pipefail
          if [[ "${ASC_SETUP_MODE:-false}" == true ]]; then exit 0; fi
          cd "$CM_BUILD_DIR/mobile"
          # Only version/build/submission are written; never export review secrets.
          ruby scripts/asc_config.rb >> "$CM_ENV"
      - name: Validate request and emit API follow-up report
        script: |
          set -euo pipefail
          if [[ "${ASC_SETUP_MODE:-false}" == true ]]; then exit 0; fi
          cd "$CM_BUILD_DIR/mobile"
          mkdir -p build/asc
          cp asc/api-followup.md build/asc/asc-api-followup.md
          python3 scripts/asc_validate.py
          ruby -r ./scripts/asc_config -e 'AscConfig.read(ENV); puts "ASC request validation PASS"'
          # Secrets originate only from the existing Codemagic integration.
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?ASC integration key ID missing}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?ASC integration issuer missing}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?ASC integration key missing}"
      - name: Install shared web and isolated app dependencies
        script: |
          set -euo pipefail
          if [[ "${ASC_SETUP_MODE:-false}" == true ]]; then exit 0; fi
          cd "$CM_BUILD_DIR"
          npx --yes pnpm@10.33.0 install --frozen-lockfile --ignore-scripts
          npx --no-install prisma generate
          cd "$CM_BUILD_DIR/mobile"
          npm ci
          bundle config set --local path vendor/bundle
          bundle config set --local frozen true
          bundle install
      - name: Prepare actual native app and capture two five-screen sets
        script: |
          set -euo pipefail
          if [[ "${ASC_SETUP_MODE:-false}" == true ]]; then exit 0; fi
          cd "$CM_BUILD_DIR/mobile"
          if [[ -z "${MOBILE_RC_IOS_PUBLIC_KEY:-}" || "$MOBILE_RC_IOS_PUBLIC_KEY" != appl_* ]]; then
            echo "Set the existing RevenueCat public iOS SDK key in kakomon_ios." >&2
            exit 1
          fi
          # Simulator only. The ASC build is already uploaded by the other workflow.
          npm run build
          BUILD_NUMBER="$ASC_BUILD_NUMBER" bundle exec npm run ios:prepare
          bash scripts/asc_capture.sh
      - name: Upload listing and screenshots; optionally submit for review
        script: |
          set -euo pipefail
          if [[ "${ASC_SETUP_MODE:-false}" == true ]]; then exit 0; fi
          cd "$CM_BUILD_DIR/mobile"
          if [[ "${SUBMIT_FOR_REVIEW:-false}" == true ]]; then
            python3 -m venv .cache/asc5-venv
            .cache/asc5-venv/bin/pip install --disable-pip-version-check cryptography==48.0.1
            export ASC_SETUP_PYTHON="$PWD/.cache/asc5-venv/bin/python"
          fi
          # No publishing block: only the guarded fastlane lane can submit.
          FASTLANE_SKIP_UPDATE_CHECK=1 FASTLANE_HIDE_CHANGELOG=1 \
            bundle exec fastlane ios asc_metadata
      - name: Prepare ASC resources through API without review submission
        script: |
          set -euo pipefail
          if [[ "${ASC_SETUP_MODE:-false}" != true ]]; then exit 0; fi
          cd "$CM_BUILD_DIR/mobile"
          python3 -m venv .cache/asc5-venv
          .cache/asc5-venv/bin/pip install --disable-pip-version-check cryptography==48.0.1
          .cache/asc5-venv/bin/python scripts/asc_setup.py
    artifacts:
      - mobile/fastlane/screenshots/ja/*.jpg
      - mobile/fastlane/screenshots/manifest.json
      - mobile/build/asc/*.md
      - mobile/build/asc/result.json
      - mobile/build/asc/setup-result.json
      - mobile/build/asc/simulator-build.log
      - mobile/build/asc/diagnostics/**/*.log
      - mobile/build/asc/diagnostics/**/*.txt
      - mobile/build/asc/diagnostics/**/*.json
      - mobile/build/asc/diagnostics/**/*.html
      - mobile/build/asc/diagnostics/**/*.xml
      - mobile/build/asc/diagnostics/**/*.png
